name: Build and Deploy to GitHub Pages (with daily hash)

on:
  # 1️⃣ Rebuild once per day automatically (2 AM UTC)
  schedule:
    - cron: "0 2 * * *"

  # 2️⃣ Rebuild whenever you push to main/master
  push:
    branches: ["main", "master"]

  # 3️⃣ Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout your repository code
      - name: Checkout
        uses: actions/checkout@v4

      # --- Setup Ruby (the version doesn’t need to match your local Ruby exactly)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      # --- Install dependencies
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      # --- Touch a rebuild marker so each daily run produces a commit
      - name: Touch rebuild marker
        run: date > _rebuild.txt

      # --- Build the Jekyll site
      - name: Build site
        run: |
          echo "🔍 Jekyll version:"
          bundle exec jekyll -v
          echo "🔍 Building site..."
          bundle exec jekyll build --trace --verbose

      # --- Deploy the site to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
